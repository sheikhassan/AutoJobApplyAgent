services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobhunter}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 20}
  backend:
    build: .
    restart: unless-stopped
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000 --proxy-headers
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobhunter}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    expose: ["8000"]
    healthcheck: {test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"], interval: 15s, timeout: 5s, retries: 10}
  scheduler:
    build: .
    restart: unless-stopped
    command: python -m app.scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobhunter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobhunter}
    depends_on: {backend: {condition: service_healthy}}
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}}
    restart: unless-stopped
    depends_on: {backend: {condition: service_healthy}}
    expose: ["3000"]
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
